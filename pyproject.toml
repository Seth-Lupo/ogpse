[project]
name = "ogpse"
version = "0.1.0"
description = "Off-grid solar + battery firm-power site evaluator"
readme = "README.md"
authors = [{ name = "Seth Lupo" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "nrel-pysam>=7.1.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pvlib>=0.16.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
ogpse = "ogpse.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
